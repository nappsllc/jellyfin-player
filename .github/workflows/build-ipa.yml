name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # iPhone Duo: iOS 27 shows apps built with an SDK older than iOS 27.1 letterboxed (a small phone-sized
    # window in the middle) on the unfolded inner screen. `xcode-27` is GitHub's image with Xcode 27.x.
    runs-on: xcode-27
    env:
      # Every build gets a higher version so SideStore offers it as an update.
      APP_VERSION: 1.0.${{ github.run_number }}
      APP_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode >= 27.1
        run: |
          x=$(ls -d /Applications/Xcode*.app | while read a; do
                v=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$a/Contents/Info.plist" 2>/dev/null)
                echo "$v $a"; done | sort -V | tail -1)
          v=${x%% *}; a=${x#* }
          echo "Newest Xcode: $v at $a"
          if [ "$(printf '%s\n27.1\n' "$v" | sort -V | head -1)" != "27.1" ]; then
            echo "::error::Newest Xcode on this runner is '${v:-none}'; the iPhone Duo inner screen needs >= 27.1"; exit 1
          fi
          sudo xcode-select -s "$a/Contents/Developer"

      - name: Show Xcode version and schemes
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -list -project JellyPlayer.xcodeproj

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project JellyPlayer.xcodeproj \
            -target JellyPlayer \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$APP_BUILD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Check the app was built against the iOS 27.1+ SDK
        run: |
          sdk=$(/usr/libexec/PlistBuddy -c "Print DTSDKName" build/Release-iphoneos/JellyPlayer.app/Info.plist)
          echo "Built with $sdk"
          ver=${sdk#iphoneos}
          if [ "$(printf '%s\n27.1\n' "$ver" | sort -V | head -1)" != "27.1" ]; then
            echo "::error::Built with $sdk; the iPhone Duo needs iphoneos27.1 or newer"; exit 1
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/JellyPlayer.app Payload/
          zip -qry JellyPlayer.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: JellyPlayer-ipa
          path: JellyPlayer.ipa
          retention-days: 30

      # On main: publish a GitHub release with the IPA and a SideStore/AltStore source feed.
      # Add this URL as a source in SideStore to get updates:
      #   https://github.com/<owner>/<repo>/releases/latest/download/apps.json
      - name: Write SideStore source
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REPO: ${{ github.repository }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          python3 .github/scripts/make_source.py \
            --repo "$REPO" \
            --version "$APP_VERSION" \
            --build "$APP_BUILD" \
            --ipa JellyPlayer.ipa \
            --notes "$NOTES" \
            --out apps.json
          cat apps.json

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v$APP_VERSION" JellyPlayer.ipa apps.json \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "JellyPlayer $APP_VERSION" \
            --notes "$NOTES" \
            --latest
