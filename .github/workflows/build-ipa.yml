name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project JellyPlayer.xcodeproj \
            -target JellyPlayer \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/JellyPlayer.app Payload/
          zip -qry JellyPlayer.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: JellyPlayer-ipa
          path: JellyPlayer.ipa
          retention-days: 30
